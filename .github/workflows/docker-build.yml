name: DataShield CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test-push-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Get the code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Build Docker image
      - name: Build Docker image
        run: |
          docker build -t datashield-app ./app

      # 3. Run container for testing
      - name: Test Docker image
        run: |
          docker run -d --name datashield-app -p 8080:80 datashield-app
          sleep 5
          curl http://localhost:8080/health

      # 4. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Tag image
      - name: Tag Docker image
        run: |
          docker tag datashield-app joy7sk/datashield-app:latest

      # 6. Push image to Docker Hub
      - name: Push Docker image
        run: |
          docker push joy7sk/datashield-app:latest

      # 7. Deploy to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull joy7sk/datashield-app:latest
            docker stop datashield-app || true
            docker rm datashield-app || true
            docker run -d --name datashield-app -p 80:80 joy7sk/datashield-app:latest
            docker ps
